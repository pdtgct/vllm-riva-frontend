# Home/RunPod values for the chart-shaped riva_frontend module.
# This file is the sole source of its image, listener endpoints, GPU
# declaration, model selectors, and finite resource/lifecycle bounds.
# It intentionally contains no TLS, authentication, credential, or
# deployment-specific encryption policy (ENV-SEC-003).
service_name: riva-frontend
image: docker.io/ptanski/nemotron-omni-port:dev-v0.24.0
deployment_image: docker.io/ptanski/nemotron-omni-port:dev-v0.24.0
image_pull_policy: Always
gpu_class: L4
gpu_resource: nvidia.com/gpu
workspace_claim_name: port-workspace

model: nvidia/nemotron-3.5-asr-streaming-0.6b
served_model_name: nemotron-asr
stage_config_path: /workspace/repos/vllm-omni/vllm_omni/model_executor/stage_configs/nemotron_asr.yaml
http_host: 0.0.0.0
http_port: 8000
grpc_bind: 0.0.0.0:50051
grpc_service_port: 50051

grpc_receive_max_bytes: 33619968
grpc_config_envelope_max_bytes: 65536
unary_max_encoded_audio_bytes: 33554432
unary_max_decoded_duration_seconds: 600.0
max_riff_header_bytes: 1048576
load_shed_max_sessions: 64
pre_submit_max_samples: 65536
preconfiguration_timeout: 30.0
session_idle_timeout: 60.0
session_finalization_timeout: 180.0
session_cleanup_timeout: 30.0
plugin_shutdown_grace: 240.0
ws_receive_max_bytes: 16777216
ws_event_envelope_max_bytes: 8388608
http_multipart_envelope_max_bytes: 33816576
http_request_header_max_bytes: 65536
http_content_type_max_bytes: 4096
http_multipart_boundary_max_bytes: 200
http_multipart_max_parts: 5
http_multipart_max_header_bytes: 8192
http_text_field_max_bytes: 4096
http_request_timeout: 900.0
max_session_duration: 600.0
resampler_identifier: scipy-poly-v1

pin: vllm-omni=eccf94f334241ea2b9c35732bf1a2de4e26ca032;vllm=ee0da84ab9e04ac7610e28580af62c365e898389
precision_policy: fp32-bringup-v1
