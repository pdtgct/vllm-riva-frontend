[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-riva-frontend"
dynamic = ["version"]
description = "Riva and Speech NIM compatibility frontend for vLLM, as an endpoint plugin"
readme = "README.md"
# @spec ING-VEH-027 (vLLM's own range)
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
# @spec ING-EP-002, ING-EP-021 (no vLLM or model-plugin dependency)
dependencies = [
    "grpcio>=1.60",
    "grpcio-health-checking>=1.60",
    "grpcio-reflection>=1.60",
    "nvidia-riva-client==2.26.0",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "scipy>=1.14",
]

[project.urls]
Repository = "https://github.com/pdtgct/vllm-riva-frontend"

# @spec ING-EP-001, ING-CLI-004 (one entry point, no client script)
[project.entry-points."vllm.endpoint_plugins"]
riva_frontend = "vllm_riva_frontend:plugin"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.11",
    "packaging>=23",
    "pytest>=8",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "pyyaml>=6",
    "ruff>=0.15",
    "types-pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vllm_riva_frontend.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "engine: imports the RFC 1 + RFC 2 vLLM tree",
    "real_factory: seam conformance against the model plugin's factory",
    "gpu: needs an installed engine on CUDA",
]
addopts = [
    "-ra",
    "--cov=vllm_riva_frontend",
    "--cov-report=term-missing",
    "--cov-fail-under=90.01",
]

[tool.coverage.run]
omit = ["tests/*", "vllm_riva_frontend/version.py"]

[tool.coverage.report]
precision = 2

# @spec ING-EP-022 (ruff and mypy name the lowest supported version)
[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vllm_riva_frontend"]

[[tool.mypy.overrides]]
module = [
    "grpc",
    "grpc.*",
    "grpc_health",
    "grpc_health.*",
    "grpc_reflection",
    "grpc_reflection.*",
    "riva",
    "riva.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
