# Gates the declared interpreter range (ING-VEH-027, ING-EP-022).
#
# The plugin is imported into vLLM's interpreter, so it declares vLLM's
# range and must work on its lowest version. The floor job (3.11) is the
# load-bearing one; 3.12 is the current host lane. 3.13 and 3.14 are inside
# the declared range but not executed here, so the README records them as
# declared-but-unverified. Keep the README's "Supported Python versions"
# table in step with this matrix.
#
# Dependencies are resolved per interpreter rather than shared, because a
# floor run against ceiling-resolved dependencies is not floor evidence.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve dependencies for this interpreter
        run: uv sync --python ${{ matrix.python-version }}

      # The plugin runs inside vLLM's process and the tests import vLLM's
      # serving modules, so they need the vLLM core tree it targets (RFC 1 and
      # RFC 2 merged). Its Python sources are importable from a checkout; the
      # CPU requirements supply what those imports need.
      - name: Check out vLLM core
        uses: actions/checkout@v4
        with:
          repository: pdtgct/vllm
          ref: c7cf80ac45e36259eb7c7c43d4f93b4b929d3c1d
          path: vllm-core

      - name: Install vLLM core's CPU requirements
        run: >-
          uv pip install --python .venv
          -r vllm-core/requirements/cpu.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check src tests

      # Floor lane only: mypy's language level is pinned to the floor in
      # pyproject, and that verdict needs floor-resolved stubs.
      - name: Types
        if: matrix.python-version == '3.11'
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Tests
        env:
          PYTHONPATH: vllm-core
        run: uv run --python ${{ matrix.python-version }} pytest -q
