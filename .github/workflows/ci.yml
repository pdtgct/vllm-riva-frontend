# Gates the declared interpreter range (ING-VEH-027, ING-EP-022).
#
# The plugin is imported into vLLM's interpreter, so it declares vLLM's
# range and must work on its lowest version. The floor job (3.11) is the
# load-bearing one; 3.12 is the current host lane. 3.13 and 3.14 are inside
# the declared range but not executed here, so the README records them as
# declared-but-unverified. Keep the README's "Supported Python versions"
# table in step with this matrix.
#
# Dependencies are resolved per interpreter rather than shared, because a
# floor run against ceiling-resolved dependencies is not floor evidence.
# In the floor lane a missing prerequisite of the floor gate fails the lane
# instead of skipping the gate (RIVA_FRONTEND_FLOOR_GATE_REQUIRED=1).
#
# The wheels job builds both distributions (the frontend and the seam
# conformance suite's vllm-riva-frontend-dev, ING-CORE-036) and checks their
# metadata and the suite's collection from a fresh environment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve dependencies for this interpreter
        run: uv sync --python ${{ matrix.python-version }}

      # The plugin runs inside vLLM's process and the tests import vLLM's
      # serving modules, so they need the vLLM core tree it targets (RFC 2's
      # endpoint-plugin lifecycle, readiness and drain). Its Python sources
      # are importable from a checkout; the CPU requirements supply what
      # those imports need. The pin is the stage 2 build this release targets
      # (pdtgct/vllm branch stage2-build-20261117: vllm-project/vllm#67374,
      # #67375, #67583, #67144 and #67151, plus #65546 and #67294).
      - name: Check out vLLM core
        uses: actions/checkout@v4
        with:
          repository: pdtgct/vllm
          ref: 6d8f5f4291359723684aaec62264fc81d8c6578b
          path: vllm-core

      - name: Install vLLM core's CPU requirements
        run: >-
          uv pip install --python .venv
          -r vllm-core/requirements/cpu.txt
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match

      - name: Lint
        run: >-
          uv run --python ${{ matrix.python-version }}
          ruff check src tests dev scripts

      # Floor lane only: mypy's language level is pinned to the floor in
      # pyproject, and that verdict needs floor-resolved stubs.
      - name: Types
        if: matrix.python-version == '3.11'
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Tests
        if: matrix.python-version != '3.11'
        env:
          PYTHONPATH: vllm-core
        run: uv run --python ${{ matrix.python-version }} pytest -q

      # The floor lane: the floor gate (ING-VEH-027) fails, not skips, on a
      # missing prerequisite.
      - name: Tests (floor gate required)
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: vllm-core
          RIVA_FRONTEND_FLOOR_GATE_REQUIRED: "1"
        run: uv run --python ${{ matrix.python-version }} pytest -q

  wheels:
    runs-on: ubuntu-latest
    name: wheels
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build both distributions
        run: uv build --all-packages --python 3.11 --out-dir dist

      # Metadata of both wheels, then the suite collected from both wheels
      # installed into a fresh environment outside the checkout (no vLLM).
      - name: Check the wheels
        run: >-
          uv run --python 3.11 --no-project
          python scripts/check_dev_wheels.py dist
