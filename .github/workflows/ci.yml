# Gates the declared interpreter range (ING-VEH-019).
#
# The floor job is the load-bearing one: the plugin is imported into the
# host's interpreter, so a package that only works on the newest supported
# Python is undeployable where it is actually meant to run. Static checks
# cannot stand in for it. The floor is Python 3.11, matching vLLM core.
# A package that only imports on a newer interpreter is undeployable on
# the host that will actually load it.
#
# Dependencies are resolved per interpreter rather than shared, because a
# floor run against ceiling-resolved dependencies is not floor evidence.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is vLLM core's floor. 3.12 is the other executed lane.
        # 3.13 and 3.14 are inside requires-python but not this matrix.
        python-version: ["3.11", "3.12"]
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve dependencies for this interpreter
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      # Floor lane only: mypy's language level is pinned to the floor.
      - name: Types
        if: matrix.python-version == '3.11'
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
